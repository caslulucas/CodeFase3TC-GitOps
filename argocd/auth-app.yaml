apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: auth
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/caslulucas/CodeFase3TC-GitOps.git
    targetRevision: main
    path: apps/auth

  destination:
    server: https://kubernetes.default.svc
    namespace: auth

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  syncOptions:
  # Cria o namespace auth automaticamente caso não exista
  - CreateNamespace=true