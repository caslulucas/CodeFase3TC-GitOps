apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: analytics
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/caslulucas/CodeFase3TC-GitOps.git
    targetRevision: HEAD
    path: apps/analytics

  destination:
    server: https://kubernetes.default.svc
    namespace: analytics

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  syncOptions:
  - CreateNamespace=true