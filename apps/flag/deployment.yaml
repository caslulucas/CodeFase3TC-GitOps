apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-deployment
  namespace: flag
  labels:
    app: flag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 045451774875.dkr.ecr.us-east-1.amazonaws.com/togglemaster-flag
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          # envFrom:
          #   - configMapRef:
          #       name: flag-configmap
          #   - secretRef:
          #       name: flag-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

         ### readinessProbe:
            #httpGet:
              #path: /health
             # port: 8002
            #initialDelaySeconds: 10
            #periodSeconds: 10
          #livenessProbe:
            #httpGet:
              #path: /health
             # port: 8002
            #initialDelaySeconds: 20
           # periodSeconds: 15 
          
